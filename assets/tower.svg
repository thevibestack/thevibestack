<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560">
  <title>La Torre Vibe Stack: Fundamentos, Prompts, Editores IA, Agentes y SDD</title>
  <defs>
    <linearGradient id="towerBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0014"/>
      <stop offset="100%" stop-color="#1a0033"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#EAB308" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#EAB308" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="floorGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#9D4EDD" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9D4EDD" stop-opacity="0"/>
    </radialGradient>
    <filter id="towerGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="560" fill="url(#towerBg)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="90" cy="60" r="1.2"><animate attributeName="opacity" values="0.8;0.15;0.8" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="35" r="1"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.6s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="590" cy="45" r="1.3"><animate attributeName="opacity" values="0.85;0.2;0.85" dur="3.7s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="710" cy="90" r="1"><animate attributeName="opacity" values="0.7;0.12;0.7" dur="2.9s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="200" r="1.1"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="4s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="130" cy="220" r="1"><animate attributeName="opacity" values="0.65;0.12;0.65" dur="3.4s" begin="1.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Beacon of light from the top -->
  <polygon points="392,164 408,164 430,20 370,20" fill="url(#beamGrad)" opacity="0">
    <animate attributeName="opacity" values="0;0;0.9;0.4;0.9" keyTimes="0;0.55;0.7;0.85;1" dur="6s" repeatCount="indefinite"/>
  </polygon>

  <!-- Floor glow -->
  <ellipse cx="400" cy="522" rx="300" ry="34" fill="url(#floorGlow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- BLOCK 1: FUNDAMENTOS -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -620;0 0" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" dur="0.45s" begin="0.1s" fill="freeze"/>
    <polygon points="220,376 400,286 580,376 400,466" fill="#9D4EDD"/>
    <polygon points="220,376 400,466 400,520 220,430" fill="#9D4EDD"/>
    <polygon points="220,376 400,466 400,520 220,430" fill="#000000" opacity="0.5"/>
    <polygon points="580,376 400,466 400,520 580,430" fill="#9D4EDD"/>
    <polygon points="580,376 400,466 400,520 580,430" fill="#000000" opacity="0.28"/>
    <polyline points="220,376 400,286 580,376" fill="none" stroke="#c77dff" stroke-width="2" filter="url(#towerGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="2.6s" repeatCount="indefinite"/>
    </polyline>
    <text transform="matrix(1,0.5,0,1,310,448)" font-family="'Fira Code','Courier New',monospace" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#ffffff" filter="url(#towerGlow)">FUNDAMENTOS</text>
  </g>

  <!-- BLOCK 2: PROMPTS -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -620;0 0" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" dur="0.45s" begin="0.55s" fill="freeze"/>
    <polygon points="250,326 400,251 550,326 400,401" fill="#FF00E5"/>
    <polygon points="250,326 400,401 400,451 250,376" fill="#FF00E5"/>
    <polygon points="250,326 400,401 400,451 250,376" fill="#000000" opacity="0.5"/>
    <polygon points="550,326 400,401 400,451 550,376" fill="#FF00E5"/>
    <polygon points="550,326 400,401 400,451 550,376" fill="#000000" opacity="0.28"/>
    <polyline points="250,326 400,251 550,326" fill="none" stroke="#ff7bec" stroke-width="2" filter="url(#towerGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="2.8s" repeatCount="indefinite"/>
    </polyline>
    <text transform="matrix(1,0.5,0,1,325,388.5)" font-family="'Fira Code','Courier New',monospace" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#ffffff" filter="url(#towerGlow)">PROMPTS</text>
  </g>

  <!-- BLOCK 3: EDITORES IA -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -620;0 0" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" dur="0.45s" begin="1s" fill="freeze"/>
    <polygon points="278,280 400,219 522,280 400,341" fill="#FF6B35"/>
    <polygon points="278,280 400,341 400,387 278,326" fill="#FF6B35"/>
    <polygon points="278,280 400,341 400,387 278,326" fill="#000000" opacity="0.5"/>
    <polygon points="522,280 400,341 400,387 522,326" fill="#FF6B35"/>
    <polygon points="522,280 400,341 400,387 522,326" fill="#000000" opacity="0.28"/>
    <polyline points="278,280 400,219 522,280" fill="none" stroke="#ffb59a" stroke-width="2" filter="url(#towerGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="3s" repeatCount="indefinite"/>
    </polyline>
    <text transform="matrix(1,0.5,0,1,339,333.5)" font-family="'Fira Code','Courier New',monospace" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#ffffff" filter="url(#towerGlow)">EDITORES IA</text>
  </g>

  <!-- BLOCK 4: AGENTES -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -620;0 0" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" dur="0.45s" begin="1.45s" fill="freeze"/>
    <polygon points="304,238 400,190 496,238 400,286" fill="#00D9FF"/>
    <polygon points="304,238 400,286 400,328 304,280" fill="#00D9FF"/>
    <polygon points="304,238 400,286 400,328 304,280" fill="#000000" opacity="0.5"/>
    <polygon points="496,238 400,286 400,328 496,280" fill="#00D9FF"/>
    <polygon points="496,238 400,286 400,328 496,280" fill="#000000" opacity="0.28"/>
    <polyline points="304,238 400,190 496,238" fill="none" stroke="#9eeeff" stroke-width="2" filter="url(#towerGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="3.2s" repeatCount="indefinite"/>
    </polyline>
    <text transform="matrix(1,0.5,0,1,352,283)" font-family="'Fira Code','Courier New',monospace" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#ffffff" filter="url(#towerGlow)">AGENTES</text>
  </g>

  <!-- BLOCK 5: SDD -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -620;0 0" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" dur="0.45s" begin="1.9s" fill="freeze"/>
    <polygon points="328,200 400,164 472,200 400,236" fill="#EAB308"/>
    <polygon points="328,200 400,236 400,274 328,238" fill="#EAB308"/>
    <polygon points="328,200 400,236 400,274 328,238" fill="#000000" opacity="0.5"/>
    <polygon points="472,200 400,236 400,274 472,238" fill="#EAB308"/>
    <polygon points="472,200 400,236 400,274 472,238" fill="#000000" opacity="0.28"/>
    <polyline points="328,200 400,164 472,200" fill="none" stroke="#fff3b0" stroke-width="2" filter="url(#towerGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="3.4s" repeatCount="indefinite"/>
    </polyline>
    <text transform="matrix(1,0.5,0,1,364,237)" font-family="'Fira Code','Courier New',monospace" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#ffffff" filter="url(#towerGlow)">SDD</text>
  </g>

  <!-- Rising particles around the tower -->
  <g fill="#00D9FF">
    <circle cx="250" cy="500" r="2"><animate attributeName="cy" values="500;180;500" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="510" r="1.8" fill="#FF00E5"><animate attributeName="cy" values="510;200;510" dur="12s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.85;0" dur="12s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="520" r="1.6" fill="#EAB308"><animate attributeName="cy" values="520;220;520" dur="11s" begin="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="11s" begin="6s" repeatCount="indefinite"/></circle>
    <circle cx="490" cy="505" r="1.6" fill="#9D4EDD"><animate attributeName="cy" values="505;190;505" dur="9s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="9s" begin="1.5s" repeatCount="indefinite"/></circle>
  </g>
</svg>

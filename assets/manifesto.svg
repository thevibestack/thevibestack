<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <title>Manifiesto Vibe Coder: No soy dev, soy Vibe Coder. No escribo líneas, dirijo inteligencia. Fundamentos más Prompts más Agentes igual a Ship.</title>
  <style>
    .l1 { animation: t1 3.2s steps(35) 0.6s forwards; }
    .l2 { animation: t2 3.3s steps(37) 4.4s forwards; }
    .l3 { animation: t3 4.7s steps(59) 8.3s forwards; }
    @keyframes t1 { from { width: 0; } to { width: 440px; } }
    @keyframes t2 { from { width: 0; } to { width: 460px; } }
    @keyframes t3 { from { width: 0; } to { width: 745px; } }
    .cur { opacity: 0; animation: show 0.01s 13.2s forwards, blink 1.1s 13.2s step-end infinite; }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .prompt { fill: #00D9FF; font-weight: 700; }
    .txt { fill: #e6e6f0; }
    .hl { fill: #EAB308; font-weight: 700; }
  </style>
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#0a0014"/>
    </linearGradient>
    <filter id="termGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="c1"><rect class="l1" x="44" y="76" width="0" height="28"/></clipPath>
    <clipPath id="c2"><rect class="l2" x="44" y="126" width="0" height="28"/></clipPath>
    <clipPath id="c3"><rect class="l3" x="44" y="176" width="0" height="28"/></clipPath>
  </defs>

  <!-- Terminal window -->
  <rect x="20" y="16" width="860" height="228" rx="12" fill="url(#termBg)" stroke="#2a2a4a" stroke-width="1.5"/>
  <circle cx="48" cy="40" r="6" fill="#ff5f56"/>
  <circle cx="70" cy="40" r="6" fill="#ffbd2e"/>
  <circle cx="92" cy="40" r="6" fill="#27c93f"/>
  <text x="450" y="45" font-family="'Fira Code','Courier New',monospace" font-size="13" fill="#8a8aa8" text-anchor="middle">thevibestack — zsh</text>

  <g font-family="'Fira Code','Courier New',monospace" font-size="19">
    <!-- Line 1 -->
    <g clip-path="url(#c1)">
      <text x="44" y="97"><tspan class="prompt">&gt; </tspan><tspan class="txt">Profesional orquestando tecnología.</tspan></text>
    </g>
    <!-- Line 2 -->
    <g clip-path="url(#c2)">
      <text x="44" y="147"><tspan class="prompt">&gt; </tspan><tspan class="txt">Esta es una nueva forma de construir.</tspan></text>
    </g>
    <!-- Line 3 -->
    <g clip-path="url(#c3)">
      <text x="44" y="197"><tspan class="prompt">&gt; </tspan><tspan class="txt">Lógica de Negocio + Arquitectura + Prompts + Agentes = </tspan><tspan class="hl">SHIP 🚀</tspan></text>
    </g>
  </g>

  <!-- Blinking cursor at the end -->
  <rect class="cur" x="775" y="181" width="11" height="22" fill="#00D9FF" filter="url(#termGlow)"/>
</svg>

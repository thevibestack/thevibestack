<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <title>Pipeline SDD de TheVibeStack: Idea, Spec, Argumentos, IA construye, Review, Ship</title>
  <defs>
    <linearGradient id="pipeBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0014"/>
      <stop offset="100%" stop-color="#14002e"/>
    </linearGradient>
    <linearGradient id="pipeLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EAB308"/>
      <stop offset="35%" stop-color="#9D4EDD"/>
      <stop offset="65%" stop-color="#FF00E5"/>
      <stop offset="100%" stop-color="#00D9FF"/>
    </linearGradient>
    <filter id="pipeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="orbGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="pipePath" d="M 100,140 L 1100,140" fill="none"/>
  </defs>

  <rect width="1200" height="300" fill="url(#pipeBg)"/>

  <!-- Faint stars -->
  <g fill="#ffffff" opacity="0.45">
    <circle cx="150" cy="40" r="1"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="30" r="1.2"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="2.8s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="45" r="1"><animate attributeName="opacity" values="0.6;0.12;0.6" dur="3.7s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="35" r="1.1"><animate attributeName="opacity" values="0.65;0.1;0.65" dur="3s" begin="1.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- The pipeline -->
  <use href="#pipePath" stroke="url(#pipeLine)" stroke-width="3" opacity="0.9" filter="url(#pipeGlow)"/>

  <g font-family="'Fira Code','Courier New',monospace" text-anchor="middle">
    <!-- NODE 1: Idea -->
    <g>
      <circle cx="100" cy="140" r="26" fill="#14002e" stroke="#EAB308" stroke-width="2.5" filter="url(#pipeGlow)">
        <animate attributeName="stroke-width" values="2.5;5;2.5;2.5" keyTimes="0;0.04;0.14;1" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="100" cy="134" r="8" fill="none" stroke="#EAB308" stroke-width="2"/>
      <line x1="100" y1="122" x2="100" y2="118" stroke="#EAB308" stroke-width="2"/>
      <line x1="91" y1="126" x2="88" y2="123" stroke="#EAB308" stroke-width="2"/>
      <line x1="109" y1="126" x2="112" y2="123" stroke="#EAB308" stroke-width="2"/>
      <rect x="96" y="144" width="8" height="4" rx="1" fill="#EAB308"/>
      <text x="100" y="205" font-size="14" fill="#8b93a7">Idea
        <animate attributeName="fill" values="#8b93a7;#ffffff;#8b93a7;#8b93a7" keyTimes="0;0.04;0.14;1" dur="12s" repeatCount="indefinite"/>
      </text>
    </g>
    <!-- NODE 2: Spec -->
    <g>
      <circle cx="300" cy="140" r="26" fill="#14002e" stroke="#9D4EDD" stroke-width="2.5" filter="url(#pipeGlow)">
        <animate attributeName="stroke-width" values="2.5;5;2.5;2.5" keyTimes="0;0.04;0.14;1" dur="12s" begin="2.4s" repeatCount="indefinite"/>
      </circle>
      <rect x="291" y="128" width="18" height="24" rx="2" fill="none" stroke="#9D4EDD" stroke-width="2"/>
      <line x1="295" y1="135" x2="305" y2="135" stroke="#9D4EDD" stroke-width="2"/>
      <line x1="295" y1="140" x2="305" y2="140" stroke="#9D4EDD" stroke-width="2"/>
      <line x1="295" y1="145" x2="302" y2="145" stroke="#9D4EDD" stroke-width="2"/>
      <text x="300" y="205" font-size="14" fill="#8b93a7">Spec
        <animate attributeName="fill" values="#8b93a7;#ffffff;#8b93a7;#8b93a7" keyTimes="0;0.04;0.14;1" dur="12s" begin="2.4s" repeatCount="indefinite"/>
      </text>
    </g>
    <!-- NODE 3: Argumentos -->
    <g>
      <circle cx="500" cy="140" r="26" fill="#14002e" stroke="#FF00E5" stroke-width="2.5" filter="url(#pipeGlow)">
        <animate attributeName="stroke-width" values="2.5;5;2.5;2.5" keyTimes="0;0.04;0.14;1" dur="12s" begin="4.8s" repeatCount="indefinite"/>
      </circle>
      <rect x="488" y="129" width="24" height="16" rx="4" fill="none" stroke="#FF00E5" stroke-width="2"/>
      <polygon points="492,145 492,153 499,145" fill="#FF00E5"/>
      <line x1="493" y1="134" x2="507" y2="134" stroke="#FF00E5" stroke-width="2"/>
      <line x1="493" y1="139" x2="503" y2="139" stroke="#FF00E5" stroke-width="2"/>
      <text x="500" y="205" font-size="14" fill="#8b93a7">Argumentos
        <animate attributeName="fill" values="#8b93a7;#ffffff;#8b93a7;#8b93a7" keyTimes="0;0.04;0.14;1" dur="12s" begin="4.8s" repeatCount="indefinite"/>
      </text>
    </g>
    <!-- NODE 4: IA construye -->
    <g>
      <circle cx="700" cy="140" r="26" fill="#14002e" stroke="#FF6B35" stroke-width="2.5" filter="url(#pipeGlow)">
        <animate attributeName="stroke-width" values="2.5;5;2.5;2.5" keyTimes="0;0.04;0.14;1" dur="12s" begin="7.2s" repeatCount="indefinite"/>
      </circle>
      <polygon points="700,127 711,133.5 711,146.5 700,153 689,146.5 689,133.5" fill="none" stroke="#FF6B35" stroke-width="2"/>
      <circle cx="700" cy="140" r="4" fill="#FF6B35">
        <animate attributeName="r" values="4;6;4" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="700" y="205" font-size="14" fill="#8b93a7">IA construye
        <animate attributeName="fill" values="#8b93a7;#ffffff;#8b93a7;#8b93a7" keyTimes="0;0.04;0.14;1" dur="12s" begin="7.2s" repeatCount="indefinite"/>
      </text>
    </g>
    <!-- NODE 5: Review -->
    <g>
      <circle cx="900" cy="140" r="26" fill="#14002e" stroke="#00D9FF" stroke-width="2.5" filter="url(#pipeGlow)">
        <animate attributeName="stroke-width" values="2.5;5;2.5;2.5" keyTimes="0;0.04;0.14;1" dur="12s" begin="9.6s" repeatCount="indefinite"/>
      </circle>
      <polyline points="890,140 897,148 911,131" fill="none" stroke="#00D9FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="900" y="205" font-size="14" fill="#8b93a7">Review
        <animate attributeName="fill" values="#8b93a7;#ffffff;#8b93a7;#8b93a7" keyTimes="0;0.04;0.14;1" dur="12s" begin="9.6s" repeatCount="indefinite"/>
      </text>
    </g>
    <!-- NODE 6: Ship (rocket takes off at cycle end) -->
    <g>
      <circle cx="1100" cy="140" r="26" fill="#14002e" stroke="#EAB308" stroke-width="2.5" filter="url(#pipeGlow)">
        <animate attributeName="stroke-width" values="2.5;5;2.5;2.5" keyTimes="0;0.04;0.14;1" dur="12s" begin="12s" repeatCount="indefinite"/>
      </circle>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -80;0 -80;0 0" keyTimes="0;0.93;0.985;0.99;1" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.93;0.985;0.99;1" dur="12s" repeatCount="indefinite"/>
        <path d="M 1100,124 C 1094,132 1094,144 1100,152 C 1106,144 1106,132 1100,124 Z" fill="#EAB308"/>
        <circle cx="1100" cy="136" r="3" fill="#14002e"/>
        <polygon points="1096,148 1092,154 1097,151" fill="#EAB308"/>
        <polygon points="1104,148 1108,154 1103,151" fill="#EAB308"/>
      </g>
      <polygon points="1096,154 1104,154 1100,166" fill="#FF6B35">
        <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.92;0.95;0.985;1" dur="12s" repeatCount="indefinite"/>
      </polygon>
      <text x="1100" y="205" font-size="14" font-weight="700" fill="#8b93a7">SHIP
        <animate attributeName="fill" values="#8b93a7;#EAB308;#EAB308;#8b93a7" keyTimes="0;0.04;0.3;1" dur="12s" begin="12s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <!-- Energy orb with trail -->
  <circle r="15" fill="#00D9FF" opacity="0.35" filter="url(#orbGlow)">
    <animateMotion dur="12s" repeatCount="indefinite" begin="-0.15s">
      <mpath href="#pipePath"/>
    </animateMotion>
  </circle>
  <circle r="6" fill="#ffffff" filter="url(#orbGlow)">
    <animateMotion dur="12s" repeatCount="indefinite">
      <mpath href="#pipePath"/>
    </animateMotion>
  </circle>
</svg>

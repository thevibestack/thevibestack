<svg xmlns="http://www.w3.org/2000/svg" width="600" height="60" viewBox="0 0 600 60">
  <title>TheVibeStack — Vibe Coder and Agent Orchestrator</title>
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="55%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#FF00E5"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
        font-family="'Fira Code', 'Courier New', monospace" font-size="34" font-weight="700"
        fill="url(#logoGrad)" filter="url(#glow)">
    TheVibeStack
    <animate attributeName="opacity" values="1;0.75;1" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="440" y="50%" dominant-baseline="middle" text-anchor="middle"
        font-family="'Fira Code', 'Courier New', monospace" font-size="34" font-weight="700"
        fill="#00D9FF" filter="url(#glow)">▮
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </text>
</svg>

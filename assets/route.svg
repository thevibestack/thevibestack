<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <title>Ruta de IA de TheVibeStack: Fundamentos, ChatGPT, Cursor, Antigravity, Claude, Codex, OpenCode, modelos chinos y agentes Hermes</title>
  <defs>
    <linearGradient id="routeBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0014"/>
      <stop offset="100%" stop-color="#14002e"/>
    </linearGradient>
    <linearGradient id="routeLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9D4EDD"/>
      <stop offset="50%" stop-color="#FF00E5"/>
      <stop offset="100%" stop-color="#00D9FF"/>
    </linearGradient>
    <filter id="routeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="lightGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="routePath" d="M 80,200 C 130,175 160,160 210,168 C 260,176 290,220 340,215 C 390,210 420,165 470,172 C 520,179 550,195 600,200 C 650,205 680,162 730,168 C 780,174 810,220 860,215 C 910,210 940,165 990,172 C 1040,179 1070,190 1120,195" fill="none"/>
  </defs>

  <rect width="1200" height="360" fill="url(#routeBg)"/>

  <!-- Faint background stars -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="120" cy="50" r="1"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="35" r="1.2"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="2.7s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="55" r="1"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.9s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="40" r="1.3"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="60" r="1"><animate attributeName="opacity" values="0.6;0.12;0.6" dur="3.5s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="310" r="1"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="4.1s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="300" r="1.1"><animate attributeName="opacity" values="0.55;0.12;0.55" dur="3s" begin="0.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- The route line -->
  <use href="#routePath" stroke="url(#routeLine)" stroke-width="2.5" opacity="0.85" filter="url(#routeGlow)"/>

  <!-- Stations -->
  <g font-family="'Fira Code','Courier New',monospace" text-anchor="middle">
    <!-- 1 Fundamentos -->
    <g>
      <circle cx="80" cy="200" r="8" fill="#3a3f4b" stroke="#0a0014" stroke-width="2">
        <animate attributeName="fill" values="#3a3f4b;#9D4EDD;#3a3f4b;#3a3f4b" keyTimes="0;0.03;0.14;1" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle cx="80" cy="200" r="8" fill="none" stroke="#9D4EDD" stroke-width="2">
        <animate attributeName="r" values="8;24;24" keyTimes="0;0.067;1" dur="18s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0;0" keyTimes="0;0.067;1" dur="18s" repeatCount="indefinite"/>
      </circle>
      <text x="80" y="245" font-size="14" fill="#8b93a7">Fundamentos
        <animate attributeName="fill" values="#8b93a7;#ffffff;#8b93a7;#8b93a7" keyTimes="0;0.03;0.14;1" dur="18s" repeatCount="indefinite"/>
      </text>
    </g>
    <!-- 2 ChatGPT -->
    <g>
      <circle cx="210" cy="168" r="8" fill="#3a3f4b" stroke="#0a0014" stroke-width="2">
        <animate attributeName="fill" values="#3a3f4b;#9D4EDD;#3a3f4b;#3a3f4b" keyTimes="0;0.03;0.14;1" dur="18s" begin="2.25s" repeatCount="indefinite"/>
      </circle>
      <circle cx="210" cy="168" r="8" fill="none" stroke="#9D4EDD" stroke-width="2">
        <animate attributeName="r" values="8;24;24" keyTimes="0;0.067;1" dur="18s" begin="2.25s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0;0" keyTimes="0;0.067;1" dur="18s" begin="2.25s" repeatCount="indefinite"/>
      </circle>
      <text x="210" y="133" font-size="14" fill="#8b93a7">ChatGPT
        <animate attributeName="fill" values="#8b93a7;#ffffff;#8b93a7;#8b93a7" keyTimes="0;0.03;0.14;1" dur="18s" begin="2.25s" repeatCount="indefinite"/>
      </text>
    </g>
    <!-- 3 Cursor -->
    <g>
      <circle cx="340" cy="215" r="8" fill="#3a3f4b" stroke="#0a0014" stroke-width="2">
        <animate attributeName="fill" values="#3a3f4b;#c77dff;#3a3f4b;#3a3f4b" keyTimes="0;0.03;0.14;1" dur="18s" begin="4.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="340" cy="215" r="8" fill="none" stroke="#c77dff" stroke-width="2">
        <animate attributeName="r" values="8;24;24" keyTimes="0;0.067;1" dur="18s" begin="4.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0;0" keyTimes="0;0.067;1" dur="18s" begin="4.5s" repeatCount="indefinite"/>
      </circle>
      <text x="340" y="260" font-size="14" fill="#8b93a7">Cursor
        <animate attributeName="fill" values="#8b93a7;#ffffff;#8b93a7;#8b93a7" keyTimes="0;0.03;0.14;1" dur="18s" begin="4.5s" repeatCount="indefinite"/>
      </text>
    </g>
    <!-- 4 Antigravity -->
    <g>
      <circle cx="470" cy="172" r="8" fill="#3a3f4b" stroke="#0a0014" stroke-width="2">
        <animate attributeName="fill" values="#3a3f4b;#FF00E5;#3a3f4b;#3a3f4b" keyTimes="0;0.03;0.14;1" dur="18s" begin="6.75s" repeatCount="indefinite"/>
      </circle>
      <circle cx="470" cy="172" r="8" fill="none" stroke="#FF00E5" stroke-width="2">
        <animate attributeName="r" values="8;24;24" keyTimes="0;0.067;1" dur="18s" begin="6.75s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0;0" keyTimes="0;0.067;1" dur="18s" begin="6.75s" repeatCount="indefinite"/>
      </circle>
      <text x="470" y="137" font-size="14" fill="#8b93a7">Antigravity
        <animate attributeName="fill" values="#8b93a7;#ffffff;#8b93a7;#8b93a7" keyTimes="0;0.03;0.14;1" dur="18s" begin="6.75s" repeatCount="indefinite"/>
      </text>
    </g>
    <!-- 5 Claude -->
    <g>
      <circle cx="600" cy="200" r="8" fill="#3a3f4b" stroke="#0a0014" stroke-width="2">
        <animate attributeName="fill" values="#3a3f4b;#FF00E5;#3a3f4b;#3a3f4b" keyTimes="0;0.03;0.14;1" dur="18s" begin="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="600" cy="200" r="8" fill="none" stroke="#FF00E5" stroke-width="2">
        <animate attributeName="r" values="8;24;24" keyTimes="0;0.067;1" dur="18s" begin="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0;0" keyTimes="0;0.067;1" dur="18s" begin="9s" repeatCount="indefinite"/>
      </circle>
      <text x="600" y="245" font-size="14" fill="#8b93a7">Claude
        <animate attributeName="fill" values="#8b93a7;#ffffff;#8b93a7;#8b93a7" keyTimes="0;0.03;0.14;1" dur="18s" begin="9s" repeatCount="indefinite"/>
      </text>
    </g>
    <!-- 6 Codex -->
    <g>
      <circle cx="730" cy="168" r="8" fill="#3a3f4b" stroke="#0a0014" stroke-width="2">
        <animate attributeName="fill" values="#3a3f4b;#FF6B35;#3a3f4b;#3a3f4b" keyTimes="0;0.03;0.14;1" dur="18s" begin="11.25s" repeatCount="indefinite"/>
      </circle>
      <circle cx="730" cy="168" r="8" fill="none" stroke="#FF6B35" stroke-width="2">
        <animate attributeName="r" values="8;24;24" keyTimes="0;0.067;1" dur="18s" begin="11.25s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0;0" keyTimes="0;0.067;1" dur="18s" begin="11.25s" repeatCount="indefinite"/>
      </circle>
      <text x="730" y="133" font-size="14" fill="#8b93a7">Codex
        <animate attributeName="fill" values="#8b93a7;#ffffff;#8b93a7;#8b93a7" keyTimes="0;0.03;0.14;1" dur="18s" begin="11.25s" repeatCount="indefinite"/>
      </text>
    </g>
    <!-- 7 OpenCode -->
    <g>
      <circle cx="860" cy="215" r="8" fill="#3a3f4b" stroke="#0a0014" stroke-width="2">
        <animate attributeName="fill" values="#3a3f4b;#00D9FF;#3a3f4b;#3a3f4b" keyTimes="0;0.03;0.14;1" dur="18s" begin="13.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="860" cy="215" r="8" fill="none" stroke="#00D9FF" stroke-width="2">
        <animate attributeName="r" values="8;24;24" keyTimes="0;0.067;1" dur="18s" begin="13.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0;0" keyTimes="0;0.067;1" dur="18s" begin="13.5s" repeatCount="indefinite"/>
      </circle>
      <text x="860" y="260" font-size="14" fill="#8b93a7">OpenCode
        <animate attributeName="fill" values="#8b93a7;#ffffff;#8b93a7;#8b93a7" keyTimes="0;0.03;0.14;1" dur="18s" begin="13.5s" repeatCount="indefinite"/>
      </text>
    </g>
    <!-- 8 Chinese models -->
    <g>
      <circle cx="990" cy="172" r="8" fill="#3a3f4b" stroke="#0a0014" stroke-width="2">
        <animate attributeName="fill" values="#3a3f4b;#00D9FF;#3a3f4b;#3a3f4b" keyTimes="0;0.03;0.14;1" dur="18s" begin="15.75s" repeatCount="indefinite"/>
      </circle>
      <circle cx="990" cy="172" r="8" fill="none" stroke="#00D9FF" stroke-width="2">
        <animate attributeName="r" values="8;24;24" keyTimes="0;0.067;1" dur="18s" begin="15.75s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0;0" keyTimes="0;0.067;1" dur="18s" begin="15.75s" repeatCount="indefinite"/>
      </circle>
      <text x="990" y="133" font-size="12" fill="#8b93a7">Kimi · Z.ai · DeepSeek · Qwen
        <animate attributeName="fill" values="#8b93a7;#ffffff;#8b93a7;#8b93a7" keyTimes="0;0.03;0.14;1" dur="18s" begin="15.75s" repeatCount="indefinite"/>
      </text>
    </g>
    <!-- 9 Hermes Agents -->
    <g>
      <circle cx="1120" cy="195" r="9" fill="#3a3f4b" stroke="#0a0014" stroke-width="2">
        <animate attributeName="fill" values="#3a3f4b;#EAB308;#EAB308;#3a3f4b" keyTimes="0;0.03;0.35;1" dur="18s" begin="18s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1120" cy="195" r="9" fill="none" stroke="#EAB308" stroke-width="2">
        <animate attributeName="r" values="9;26;26" keyTimes="0;0.067;1" dur="18s" begin="18s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0;0" keyTimes="0;0.067;1" dur="18s" begin="18s" repeatCount="indefinite"/>
      </circle>
      <text x="1120" y="240" font-size="14" font-weight="700" fill="#8b93a7">Hermes Agents
        <animate attributeName="fill" values="#8b93a7;#EAB308;#EAB308;#8b93a7" keyTimes="0;0.03;0.35;1" dur="18s" begin="18s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <!-- Travelling light with trail -->
  <circle r="16" fill="#00D9FF" opacity="0.35" filter="url(#lightGlow)">
    <animateMotion dur="18s" repeatCount="indefinite" begin="-0.12s">
      <mpath href="#routePath"/>
    </animateMotion>
  </circle>
  <circle r="6" fill="#ffffff" filter="url(#lightGlow)">
    <animateMotion dur="18s" repeatCount="indefinite">
      <mpath href="#routePath"/>
    </animateMotion>
  </circle>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0014"/>
      <stop offset="55%" stop-color="#1a0033"/>
      <stop offset="100%" stop-color="#2d0052"/>
    </linearGradient>
    <!-- Retro sun gradient -->
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="50%" stop-color="#FF00E5"/>
      <stop offset="100%" stop-color="#9D4EDD"/>
    </linearGradient>
    <!-- Floor gradient -->
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12002b"/>
      <stop offset="100%" stop-color="#0a0014"/>
    </linearGradient>
    <!-- Glow filters -->
    <filter id="glowCyan" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="sunGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Sun stripes cutout -->
    <clipPath id="sunClip">
      <circle cx="600" cy="240" r="95"/>
    </clipPath>
    <!-- Scanline pattern -->
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.22"/>
    </pattern>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="400" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="40" r="1.4"><animate attributeName="opacity" values="1;0.15;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="90" r="1"><animate attributeName="opacity" values="0.9;0.1;0.9" dur="3.4s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="30" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="70" r="1"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="4s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="25" r="1.3"><animate attributeName="opacity" values="1;0.25;1" dur="2.5s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="55" r="1"><animate attributeName="opacity" values="0.9;0.15;0.9" dur="3.1s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="810" cy="30" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.3s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="80" r="1"><animate attributeName="opacity" values="0.85;0.1;0.85" dur="3.8s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="35" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" begin="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="100" r="1"><animate attributeName="opacity" values="0.9;0.15;0.9" dur="3.3s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="140" r="1"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="4.2s" begin="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="150" r="1.2"><animate attributeName="opacity" values="0.8;0.15;0.8" dur="3.6s" begin="1.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Retro sun with stripes -->
  <g filter="url(#sunGlow)">
    <g clip-path="url(#sunClip)">
      <circle cx="600" cy="240" r="95" fill="url(#sun)"/>
      <rect x="495" y="196" width="210" height="5" fill="#1a0033"/>
      <rect x="495" y="208" width="210" height="7" fill="#1a0033"/>
      <rect x="495" y="222" width="210" height="9" fill="#1a0033"/>
      <rect x="495" y="238" width="210" height="11" fill="#1a0033"/>
      <rect x="495" y="256" width="210" height="13" fill="#1a0033"/>
      <animate attributeName="opacity" values="1;0.85;1" dur="5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Horizon line -->
  <rect x="0" y="239" width="1200" height="2" fill="#FF00E5" opacity="0.8" filter="url(#glowSoft)"/>

  <!-- Floor -->
  <rect x="0" y="241" width="1200" height="159" fill="url(#floor)"/>

  <!-- Perspective grid: radial lines -->
  <g stroke="#00D9FF" stroke-width="1.2" opacity="0.55" filter="url(#glowSoft)">
    <line x1="600" y1="241" x2="-200" y2="400"/>
    <line x1="600" y1="241" x2="60" y2="400"/>
    <line x1="600" y1="241" x2="280" y2="400"/>
    <line x1="600" y1="241" x2="460" y2="400"/>
    <line x1="600" y1="241" x2="600" y2="400"/>
    <line x1="600" y1="241" x2="740" y2="400"/>
    <line x1="600" y1="241" x2="920" y2="400"/>
    <line x1="600" y1="241" x2="1140" y2="400"/>
    <line x1="600" y1="241" x2="1400" y2="400"/>
  </g>

  <!-- Perspective grid: moving horizontal lines (loop) -->
  <g stroke="#00D9FF" stroke-width="1.2" opacity="0.55" filter="url(#glowSoft)">
    <g>
      <line x1="0" y1="248" x2="1200" y2="248"/>
      <line x1="0" y1="262" x2="1200" y2="262"/>
      <line x1="0" y1="282" x2="1200" y2="282"/>
      <line x1="0" y1="308" x2="1200" y2="308"/>
      <line x1="0" y1="340" x2="1200" y2="340"/>
      <line x1="0" y1="378" x2="1200" y2="378"/>
      <line x1="0" y1="422" x2="1200" y2="422"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 44" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Floating particles -->
  <g fill="#00D9FF">
    <circle cx="200" cy="380" r="2"><animate attributeName="cy" values="380;120;380" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="390" r="1.6" fill="#FF00E5"><animate attributeName="cy" values="390;140;390" dur="11s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="11s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="385" r="2" fill="#FF6B35"><animate attributeName="cy" values="385;130;385" dur="10s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="10s" begin="4s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="375" r="1.6"><animate attributeName="cy" values="375;110;375" dur="12s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.85;0" dur="12s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="392" r="1.4" fill="#9D4EDD"><animate attributeName="cy" values="392;150;392" dur="8.5s" begin="5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="8.5s" begin="5.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 3D extruded title -->
  <g font-family="'Fira Code','Courier New',monospace" font-weight="700" text-anchor="middle">
    <!-- Extrusion layers (magenta depth) -->
    <text x="606" y="118" font-size="64" fill="#b3008f">THE VIBE STACK</text>
    <text x="605" y="116" font-size="64" fill="#d400b8">THE VIBE STACK</text>
    <text x="604" y="114" font-size="64" fill="#f000d4">THE VIBE STACK</text>
    <!-- Main face -->
    <text x="603" y="112" font-size="64" fill="#00D9FF" filter="url(#glowCyan)">THE VIBE STACK
      <animate attributeName="opacity" values="1;0.92;1" dur="3s" repeatCount="indefinite"/>
    </text>
    <!-- Subtitle -->
    <text x="600" y="152" font-size="20" font-weight="500" fill="#EAB308" letter-spacing="6" filter="url(#glowSoft)">VIBE CODER · AGENT ORCHESTRATOR</text>
    <!-- Blinking cursor -->
    <text x="925" y="112" font-size="64" fill="#00D9FF" filter="url(#glowCyan)">▮
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Scanlines overlay -->
  <rect width="1200" height="400" fill="url(#scan)" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.25;0.35" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
